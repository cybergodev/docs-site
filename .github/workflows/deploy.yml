name: Deploy Docs to Server (FTP)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs/.vitepress/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: `lastUpdated` (page timestamps + sitemap <lastmod>)
          # comes from per-file `git log`; a shallow clone would stamp every
          # page with the HEAD commit time.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run build
        env:
          # Same 8192 MB ceiling as the CLI flag in package.json's build
          # script. That CLI flag governs the `node ... vitepress build`
          # process itself (a CLI arg wins over NODE_OPTIONS for that one
          # process); this env covers the OTHER node processes `npm run build`
          # spawns — the tsx pre/post-build scripts (search-index,
          # fix-clean-urls, redirects, llms, md-mirror). Aligned so no child
          # process runs with a lower heap limit than the main build.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: docs/.vitepress/dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          protocol: ftps
